# =============================================================
# CampusAI — Docker Compose (Development)
# =============================================================
# Usage:
#   docker compose up -d          # Start all services
#   docker compose up ai-server   # Start only AI server
#   docker compose logs -f        # Follow logs
# =============================================================

services:
  # Frontend (Vite dev server)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_AI_SERVER_URL=http://ai-server:8000
    volumes:
      - ./src--frontend:/app/src--frontend
      - ./public:/app/public
    depends_on:
      - ai-server

  # Python AI/ML Server
  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - CORS_ORIGINS=http://localhost:5173,http://frontend:5173,https://campusai.app
      - AI_SERVER_HOST=0.0.0.0
      - AI_SERVER_PORT=8000
    volumes:
      - ai-models:/root/.insightface  # Cache model downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Express Backend (optional — for WebSocket/Blockchain)
  backend:
    build:
      context: ./server--backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - PORT=5000
    profiles:
      - full  # Only starts with: docker compose --profile full up

volumes:
  ai-models:
