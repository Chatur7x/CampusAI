# =============================================================
# CampusAI — CI/CD Pipeline
# =============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend Lint + Build ──────────────────────────────────
  frontend:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint src--frontend/ --max-warnings 50

      - name: Type Check
        run: npx tsc --noEmit
        continue-on-error: true  # Some strict errors expected

      - name: Build
        run: npx vite build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ── AI Server Tests ────────────────────────────────────────
  ai-server:
    name: AI Server (Lint & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check . --ignore E501
        continue-on-error: true

      - name: Verify imports
        run: python -c "from main import app; print('FastAPI app imports OK')"
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_KEY: placeholder-key

  # ── Express Backend ────────────────────────────────────────
  backend:
    name: Backend (Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server--backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server--backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type Check
        run: npx tsc --noEmit
        continue-on-error: true

  # ── Docker Build (on main only) ────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, ai-server]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build AI Server image
        run: docker build -t campusai-ai-server ./ai-server

      - name: Build Frontend image
        run: docker build -t campusai-frontend .
