# =============================================================
# CampusAI — CI/CD Pipeline
# =============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  PYTHON_VERSION: "3.12"

jobs:
  # ── Frontend Lint + Build ──────────────────────────────────
  frontend:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint src--frontend/ --max-warnings 100

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ── AI Server Checks ──────────────────────────────────────
  ai-server:
    name: AI Server (Lint & Verify)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai-server/requirements-ci.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-glx libglib2.0-0

      - name: Install Python dependencies (CI-light)
        run: pip install -r requirements-ci.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check . --ignore E501

      - name: Syntax check all modules
        run: |
          python -m py_compile main.py
          python -m py_compile config.py
          for f in models/*.py; do python -m py_compile "$f"; done
          for f in routes/*.py; do python -m py_compile "$f"; done
          for f in utils/*.py; do python -m py_compile "$f"; done
          echo "All modules pass syntax check"

      - name: Verify FastAPI app loads
        run: |
          python -c "
          import sys, importlib, types
          # Stub heavy optional modules so 'from main import app' succeeds
          for mod in [
              'insightface', 'insightface.app', 'insightface.app.FaceAnalysis',
              'mediapipe', 'mediapipe.solutions',
              'mediapipe.solutions.face_mesh',
              'torch', 'torch.nn', 'torchvision',
              'deepface', 'deepface.DeepFace',
              'prophet', 'prophet.Prophet',
              'shap',
              'evidently',
              'mlflow',
              'pyod', 'pyod.models', 'pyod.models.iforest',
              'statsmodels', 'statsmodels.tsa', 'statsmodels.tsa.arima',
              'statsmodels.tsa.arima.model',
          ]:
              sys.modules.setdefault(mod, types.ModuleType(mod))
          from main import app
          print(f'FastAPI app loaded: {len(app.routes)} routes')
          "
        env:
          SUPABASE_URL: https://akgjpqvpcugbmdenpxny.supabase.co
          SUPABASE_SERVICE_KEY: placeholder-key
          CAMPUS_LAT: "17.5"
          CAMPUS_LNG: "78.5"

  # ── Express Backend ────────────────────────────────────────
  backend:
    name: Backend (Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server--backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server--backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type Check
        run: npx tsc --noEmit

  # ── Docker Build (on main only) ────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend, ai-server, backend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build AI Server image
        run: docker build -t campusai-ai-server ./ai-server

      - name: Build Frontend image
        run: docker build -t campusai-frontend .
