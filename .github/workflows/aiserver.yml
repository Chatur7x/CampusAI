# =============================================================
# CampusAI — CI/Aiserver
# =============================================================
name: CI/Aiserver

on:
  push:
    branches: [main, develop]
    paths:
      - 'ai-server/**'
      - '.github/workflows/aiserver.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai-server/**'
      - '.github/workflows/aiserver.yml'

concurrency:
  group: aiserver-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  aiserver-check:
    name: AI Server (Lint & Verify)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai-server/requirements-ci.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-glx libglib2.0-0

      - name: Install Python dependencies (CI-light)
        run: pip install -r requirements-ci.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check . --ignore E501

      - name: Syntax check all modules
        run: |
          python -m py_compile main.py
          python -m py_compile config.py
          for f in models/*.py; do python -m py_compile "$f"; done
          for f in routes/*.py; do python -m py_compile "$f"; done
          for f in utils/*.py; do python -m py_compile "$f"; done
          echo "All modules pass syntax check"

      - name: Verify FastAPI app loads
        run: |
          python -c "
          import sys, types
          # Stub heavy optional modules so 'from main import app' succeeds
          for mod in [
              'insightface', 'insightface.app', 'insightface.app.FaceAnalysis',
              'mediapipe', 'mediapipe.solutions',
              'mediapipe.solutions.face_mesh',
              'torch', 'torch.nn', 'torchvision',
              'deepface', 'deepface.DeepFace',
              'prophet', 'prophet.Prophet',
              'shap',
              'evidently',
              'mlflow',
              'pyod', 'pyod.models', 'pyod.models.iforest',
              'statsmodels', 'statsmodels.tsa', 'statsmodels.tsa.arima',
              'statsmodels.tsa.arima.model',
          ]:
              sys.modules.setdefault(mod, types.ModuleType(mod))
          from main import app
          print(f'FastAPI app loaded: {len(app.routes)} routes')
          "
        env:
          SUPABASE_URL: https://akgjpqvpcugbmdenpxny.supabase.co
          SUPABASE_SERVICE_KEY: placeholder-key
          CAMPUS_LAT: "17.5"
          CAMPUS_LNG: "78.5"
