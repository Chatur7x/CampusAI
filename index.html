<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CampusAI — AI-Powered Smart Attendance System with face recognition, blockchain integrity, and real-time analytics." />
    <meta name="theme-color" content="#0a0e1a" />

    <title>CampusAI - Academic Management Platform</title>

    <!-- Preconnect to external origins for faster resource fetching -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://doxhysprkwywsrbdtmpo.supabase.co" crossorigin />

    <!-- Load Google Fonts asynchronously instead of render-blocking @import -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" /></noscript>

    <!-- Critical inline CSS — shows loading spinner before JS loads -->
    <style>
      body { margin: 0; background: #0a0e1a; }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      #root:empty::after {
        content: '';
        width: 40px;
        height: 40px;
        border: 2px solid #1e293b;
        border-top-color: #10b981;
        border-radius: 50%;
        animation: sp .6s linear infinite;
      }
      @keyframes sp { to { transform: rotate(360deg) } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src--frontend/main.tsx"></script>
  </body>
</html>
